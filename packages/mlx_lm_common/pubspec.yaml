name: mlx_lm_common
description: >-
  Common language model framework for MLX in Dart — a port of MLXLMCommon
  from mlx-swift-lm. Provides the LanguageModel protocol, KV caches,
  token generation, and chat abstractions.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

resolution: workspace

dependencies:
  mlx_dart: ^ 0.1.1

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
