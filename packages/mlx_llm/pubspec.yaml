name: mlx_llm
description: >-
  LLM models for MLX in Dart — a port of MLXLLM from mlx-swift-lm.
  Provides the LlmModel protocol, type registry, and LLM implementations
  starting with Llama.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

resolution: workspace

dependencies:
  mlx_dart: ^ 0.1.1
  mlx_lm_common:
    path: ../mlx_lm_common

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
